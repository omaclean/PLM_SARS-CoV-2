; Self-contained config for the prescott_iav suite.
;
; This directory is deliberately NOT under tests/ and does not use the repo-level
; pytest.ini: the two suites cover different code, have different runtimes and
; different dependency requirements, and neither may be able to break the other.
; Running
;
;     /home3/oml4h/miniconda3/envs/PRESCOTT/bin/python -m pytest \
;         /home3/oml4h/PLM_SARS-CoV-2/tests_prescott_iav
;
; from ANY working directory picks this file up, because pytest takes the rootdir
; config from the first ancestor of the given path that contains one and stops
; here.  Nothing in this suite may read, write or depend on ../pytest.ini or
; anything under ../tests/.

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 7.0

; -q keeps a large run readable; --strict-markers turns a typo'd marker into an
; error instead of a silently-never-skipped test; --strict-config does the same
; for this file.  --timeout is a backstop: the pipeline shells out to
; escott/prescott/mafft/BLAST and a hung child would otherwise hang the suite.
addopts =
    -q
    --strict-markers
    --strict-config
    --tb=short
    --timeout=900

; Markers are also registered in conftest.pytest_configure, so --strict-markers
; still holds if the suite is ever invoked with an explicit -c pointing elsewhere.
;
; Taxonomy:
;   what a test IS      unit, integration, cli, slow
;   what a test NEEDS   requires_*  -- auto-skipped when the dependency is absent
;
; `slow` and `requires_real_data` are opt-in: they are skipped unless --run-slow
; is passed, which is what keeps the default suite fast and offline.
markers =
    unit: pure, fast, no subprocess and no external binary
    integration: several modules together, still fully synthetic
    cli: exercises a module's argparse surface / main()
    slow: minute-scale; skipped unless --run-slow
    blast: legacy alias for requires_blast
    requires_escott: needs the escott/prescott entry points on PATH
    requires_blast: needs makeblastdb/blastp on PATH
    requires_mafft: needs mafft on PATH
    requires_muscle: needs muscle on PATH
    requires_dssp: needs mkdssp on PATH
    requires_r: needs Rscript on PATH
    requires_prody: needs the prody package
    requires_freesasa: needs the freesasa package
    requires_scipy: needs the scipy package
    requires_torch: needs torch (conda-forge build; never the pip wheel)
    requires_rma: needs scripts/run_mutational_accessibility.py to be importable
    requires_real_data: needs the multi-GB production inputs; skipped unless --run-slow
    requires_blat_reference: needs the shipped PRESCOTT BLAT reference data
    requires_prescott_python: needs the PRESCOTT env interpreter to exist

filterwarnings =
    ignore::DeprecationWarning


; --------------------------------------------------------------------------- ;
; Coverage targets for this suite.
;
; Coverage is opt-in rather than in addopts: it roughly doubles the runtime, and
; this suite's job is to be fast enough to run on every edit.  Turn it on with
;
;   /home3/oml4h/miniconda3/envs/PRESCOTT/bin/python -m pytest \
;       /home3/oml4h/PLM_SARS-CoV-2/tests_prescott_iav \
;       --cov=prescott_iav --cov=run_prescott_diversity \
;       --cov-report=term-missing
;
; The sections below record the intended source set and reporting options.
; --------------------------------------------------------------------------- ;

[coverage:run]
source =
    scripts/prescott_iav
    scripts/run_prescott_diversity.py
branch = True
omit =
    */tests_prescott_iav/*
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError

[coverage:html]
directory = htmlcov_prescott_iav
