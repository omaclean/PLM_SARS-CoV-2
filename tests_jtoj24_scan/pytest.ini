; Self-contained config for the JtoJ24_scan escape suite.
;
; Like tests_prescott_iav, this directory is deliberately NOT under tests/ and
; does not use the repo-level pytest.ini: the suites cover different code and
; neither may be able to break the other. Running
;
;     /home3/oml4h/miniconda3/envs/plm_entropy/bin/python -m pytest \
;         /home3/oml4h/PLM_SARS-CoV-2/tests_jtoj24_scan
;
; from ANY working directory picks this file up, because pytest takes the rootdir
; config from the first ancestor of the given path that contains one.

[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 7.0

addopts =
    -q
    --strict-markers
    --strict-config
    --tb=short

; Taxonomy:
;   what a test IS      unit, integration, cli, figure, slow
;   what a test NEEDS   requires_*  -- auto-skipped when the input is absent
;
; `slow` is opt-in: it is skipped unless --run-slow is passed, which is what
; keeps the default suite fast and free of the 150k-row background CSV.
markers =
    unit: pure, fast, fully synthetic
    integration: several functions together, still synthetic
    cli: exercises a module's argparse surface / main()
    figure: writes a PNG and inspects it
    slow: skipped unless --run-slow
    requires_real_run: needs Results/JtoJ.2.4_scan/plant
    requires_real_backgrounds: needs the PLANT backgrounds.csv

filterwarnings =
    ignore::DeprecationWarning


; --------------------------------------------------------------------------- ;
; Coverage targets. Opt-in rather than in addopts so the default run stays fast:
;
;   .../python -m pytest tests_jtoj24_scan \
;       --cov=plant_order_scan --cov=plot_plant_escape \
;       --cov=plant_population_escape --cov-report=term-missing
; --------------------------------------------------------------------------- ;

[coverage:run]
source =
    scripts/JtoJ24_scan
branch = True
omit =
    */tests_jtoj24_scan/*
    */tests/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError

[coverage:html]
directory = htmlcov_jtoj24_scan
